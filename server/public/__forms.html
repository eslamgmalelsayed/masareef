<!doctype html><meta charset="utf-8"><title>forms</title>
<!-- نسخة ثابتة من فورم الملاحظات علشان Netlify يتعرّف عليه (الإرسال بيحصل من function feedback) -->
<form name="feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="feedback" />
  <input type="text" name="kind" />
  <textarea name="message"></textarea>
  <input type="text" name="contact" />
  <input type="text" name="app" />
  <input type="text" name="device" />
  <input name="bot-field" />
</form>
