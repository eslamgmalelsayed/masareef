# سيرفر masareef-api — Base directory في Netlify = server
[build]
  publish = "public"
  command = "npm install"
  # نبني السيرفر بس لو كوده أو محرك القراية اتغير
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../src/lib/shapes.js ../src/lib/parser.js"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
