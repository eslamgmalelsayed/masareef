name: Build & Release APK
on:
  push:
    branches: [main]
    paths-ignore: ['ios/**', '.github/workflows/ios.yml', 'docs/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - run: npm ci
      - run: npm run build && npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Missing KEYSTORE_BASE64 secret"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/masareef.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/masareef.jks" >> $GITHUB_ENV

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk masareef.apk
          git log -1 --pretty=%s > notes.txt
          gh release create "b${{ github.run_number }}" masareef.apk \
            --title "مصاريفي — نسخة ${{ github.run_number }}" --notes-file notes.txt --latest
